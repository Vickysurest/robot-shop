apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-gen
  namespace: robot-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      service: load-gen
  template:
    metadata:
      labels:
        service: load-gen
    spec:
      containers:
        - name: load-gen
          image: robotshop/rs-load:latest
          env:
            - name: HOST
              value: "http://web:8080/"
            - name: NUM_CLIENTS
              value: "2"
            - name: SILENT
              value: "0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi